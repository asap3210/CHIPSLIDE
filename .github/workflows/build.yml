name: Build APK from ZIP
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          set -e
          Z=$(ls -1 *.zip | head -n1)
          echo "Usando $Z"
          mkdir -p work && unzip -q "$Z" -d work
          ROOT=$(dirname "$(find work -name settings.gradle | head -n1)")
          echo "Proyecto en $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          build-root-directory: ${{ env.ROOT }}
      - name: Build debug APK
        run: gradle --no-daemon -p "$ROOT" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chipslide-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
